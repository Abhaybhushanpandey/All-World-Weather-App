<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Weather App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow-y: auto;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 1s ease;
      background: linear-gradient(-45deg, #00b4db, #0083b0, #1cefff, #0077be);
      background-size: 400% 400%;
      animation: sunnyBackground 20s ease infinite;
      padding-bottom: 100px; /* To ensure footer doesn't overlap */
    }

    @keyframes sunnyBackground {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: fadeInUp 1s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .center-image {
      margin-bottom: 20px;
    }

    .center-image img {
      width: 160px;
      height: auto;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    input {
      padding: 10px;
      width: 70%;
      border: none;
      border-radius: 10px 0 0 10px;
      outline: none;
      font-size: 1rem;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 0 10px 10px 0;
      background-color: #00aaff;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s, transform 0.3s;
    }

    button:hover {
      background-color: #005f99;
      transform: scale(1.05);
    }

    .loading {
      display: none;
      margin-top: 20px;
      font-size: 1.5rem;
      color: yellow;
    }

    .loading-spinner {
      margin: 20px auto;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .weather {
      margin-top: 25px;
      font-size: 1.1rem;
    }

    .weather-icon {
      font-size: 50px;
      margin-top: 10px;
    }

    .forecast {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 1rem;
      padding-right: 10px;
    }

    .forecast div {
      margin-top: 10px;
    }

    .footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      animation: fadeGlow 3s infinite;
      color: #fff;
      z-index: 10;
    }

    @keyframes fadeGlow {
      0%, 100% {
        opacity: 0.7;
        text-shadow: 0 0 5px #fff, 0 0 10px #00b4db, 0 0 20px #00b4db;
      }
      50% {
        opacity: 1;
        text-shadow: 0 0 10px #fff, 0 0 20px #00b4db, 0 0 30px #00b4db;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="container">
    <h2>🌍 World Weather App</h2>

    <div class="center-image">
      <img src="image for icons.png" />
    </div>

    <div>
      <input type="text" id="cityInput" placeholder="Enter city name" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="loadingSpinner" class="loading">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>

    <div class="weather" id="weather">✨ Try searching for a city!</div>
    <div class="forecast" id="forecast"></div>
  </div>

  <!-- Animated Footer -->
  <div class="footer">Abhay Bhushan Pandey</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createParticles(type) {
      particles = [];
      const count = 150;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 3 + 2,
          radius: type === "snow" ? Math.random() * 2 + 1 : 2,
          type
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "white";
      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speed;
        if (p.y > canvas.height) {
          p.y = -p.radius;
          p.x = Math.random() * canvas.width;
        }
      }
      requestAnimationFrame(drawParticles);
    }

    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      const apiKey = '016bf25a71faf1e528ed1a58a5d1abe3';
      if (!city) return alert('Please enter a city name.');

      document.getElementById('loadingSpinner').style.display = 'block';
      document.getElementById('weather').style.display = 'none';
      document.getElementById('forecast').style.display = 'none';

      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('City not found.');
        const data = await response.json();

        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('weather').style.display = 'block';
        document.getElementById('forecast').style.display = 'block';

        const weatherIcon = getWeatherIcon(data.weather[0].main);

        document.getElementById('weather').innerHTML = `  
          <h3>${data.name}, ${data.sys.country}</h3>
          <div class="weather-icon">${weatherIcon}</div>
          <p><strong>${data.weather[0].main}</strong>: ${data.weather[0].description}</p>
          <p>🌡️ ${data.main.temp}°C | 💧 ${data.main.humidity}% | 💨 ${data.wind.speed} m/s</p>
        `;

        const condition = data.weather[0].main.toLowerCase();
        document.body.style.animation = 'none';

        if (condition.includes("rain")) {
          createParticles("rain");
          document.body.style.background = "linear-gradient(-45deg, #00b4db, #0077be, #1cefff)";
        } else if (condition.includes("snow")) {
          createParticles("snow");
          document.body.style.background = "#83a4d4";
        } else if (condition.includes("cloud")) {
          particles = [];
          document.body.style.background = "linear-gradient(-45deg, #b1bfd8, #d0dfe9, #5e6e7d)";
        } else {
          particles = [];
          document.body.style.animation = 'sunnyBackground 20s ease infinite';
        }

        const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;
        const forecastResponse = await fetch(forecastUrl);
        const forecastData = await forecastResponse.json();

        let forecastHTML = "<h4>5-Day Forecast:</h4>";
        forecastData.list.forEach((day, i) => {
          if (i % 8 === 0) {
            forecastHTML += `
              <div>
                <h5>${new Date(day.dt * 1000).toLocaleDateString()}</h5>
                <p>${day.main.temp}°C | ${day.weather[0].main}</p>
              </div>`;
          }
        });
        document.getElementById("forecast").innerHTML = forecastHTML;

      } catch (err) {
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('weather').innerHTML = `<p style="color: yellow;">❌ ${err.message}</p>`;
      }
    }

    function getWeatherIcon(condition) {
      switch (condition.toLowerCase()) {
        case 'clear':
          return '☀️';
        case 'clouds':
          return '☁️';
        case 'rain':
          return '🌧️';
        case 'snow':
          return '❄️';
        case 'thunderstorm':
          return '⚡';
        default:
          return '🌈';
      }
    }

    document.getElementById('cityInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') getWeather();
    });

    drawParticles();
  </script>
</body>
</html>
